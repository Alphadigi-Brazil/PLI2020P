name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Standalone single-file class
        run: |
          mkdir -p target/standalone
          javac -encoding UTF-8 -d target/standalone standalone/Pli2020p.java
          java -cp target/standalone pli2020p.Pli2020p --selftest

      - name: Calculator matches the encoder
        run: node tools/check-calculator.js

      - name: Demo output
        if: matrix.java == '17'
        run: java -cp target/classes br.com.alphadigi.pli2020p.demo.PliDemo
